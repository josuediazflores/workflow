[project]
name = "workflow-example-python"
version = "0.0.0"
description = "Python conformance target for the @workflow/core e2e suite"
requires-python = ">=3.10"
dependencies = [
  "vercel",
  # A transitive dependency of `vercel`, declared here only so the git pin in
  # `[tool.uv.sources]` below applies to it — a source is ignored for anything
  # this project does not require directly. See the note there.
  "vercel-queue",
  # vercel-py carries uvicorn as a dev-only dependency, so declare it here.
  "uvicorn>=0.30",
]

# Pinned to a vercel-py commit rather than a release: this app tracks the
# Python SDK's `main` so the conformance suite reports on what is actually
# being built. Bump `rev` deliberately, and re-run the suite when you do.
#
# `subdirectory` is required — the vercel-py repo root is a uv workspace whose
# build backend raises, so only the leaf packages are installable on their own.
#
# Two entries, not one, and the second is what makes the first mean anything. A
# `[tool.uv.sources]` entry applies only to a package this project requires
# *directly*, so pinning `vercel` alone left every sibling — `vercel-queue`
# included — resolving from PyPI. Naming `vercel-queue` here (and in
# `dependencies` above) makes uv resolve the whole vercel-py workspace out of
# the checkout instead, so all nine packages come from this one rev. Read
# `uv.lock` after a bump and check the `source` lines are `git` — there should
# be eight. Bumping the rev and re-running `uv lock` in place is not enough: uv
# takes the old lock as preferences, and the seven siblings it is not told about
# directly fall back to PyPI at the same version numbers, quietly. Delete
# `uv.lock` and relock from scratch instead.
#
# It matters because the Vercel world's CBOR queue transport spans two packages:
# `vercel` attaches the codec to a `Topic` / `TopicPattern` (vercel-py#265), and
# those types only learned to carry one in `vercel-queue` (vercel-py#266). The
# released vercel-queue predates #266, so a `vercel`-only bump raises at import.
#
# Regenerate the lock with `uv lock --no-config`. A global `exclude-newer` in
# `~/.config/uv/uv.toml` is otherwise recorded in `uv.lock` as an `[options]`
# block, and CI and the Vercel builder — which have no such config — then
# reject the lock under `--locked`.
#
# `uv run` re-locks too, so merely starting the app used to undo that: the
# `dev` script passes `--no-config` for the same reason. Anything else here
# that shells out to uv needs it as well.
[tool.uv.sources]
vercel = { git = "https://github.com/vercel/vercel-py", rev = "f9a16006aaa62c94e86b70e9c2b878b0d8d87f24", subdirectory = "src/vercel" }
vercel-queue = { git = "https://github.com/vercel/vercel-py", rev = "f9a16006aaa62c94e86b70e9c2b878b0d8d87f24", subdirectory = "src/vercel-queue" }

# How `@vercel/python` builds this app. Reached only because `vercel.json`
# declares `pyproject.toml` as the build src, which puts the builder in
# "declared-only" mode: filename-based entrypoint detection never runs, and
# `[[tool.vercel.workflows]]` is honoured. Without that src the two keys below
# are silently ignored — a bare ASGI app is not a recognised Python framework,
# and the builder only attaches workflows to frameworks or declared builds.
[tool.vercel]
# The web function. It serves `manifest.json`, which is the only route the e2e
# driver calls over HTTP on Vercel — runs are delivered through the queue, not
# through `/flow`.
entrypoint = "app:app"

# The workflow function. The builder imports this module at build time, reads
# `vercel.queue.get_subscriptions()`, and emits one `queue/v2beta` trigger per
# subscription onto a generated `vercel.queue.asgi_app()` handler. Importing
# `app` is what registers them, because `app.py` calls `workflow_entrypoint()`
# at import.
#
# Only one entry is allowed: every workflow consumer receives every `__wkf_*`
# message, so a second one would fail on runs registered only in the first.
[[tool.vercel.workflows]]
entrypoint = "app:registry"
